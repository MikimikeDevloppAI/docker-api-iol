name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Health-check hebdomadaire du site ESCRS (lundi 06:00 UTC) : détecte un changement
    # de markup (switch renommé, champ déplacé...) avant qu'un utilisateur ne le subisse.
    - cron: "0 6 * * 1"

jobs:
  unit:
    name: Tests unitaires (sans navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt -r tests/requirements-dev.txt
      - run: pytest -m "not live" -v

  live:
    name: Tests live ESCRS (image Docker de prod)
    runs-on: ubuntu-latest
    # Sur push : uniquement après les tests unitaires. Toujours sur schedule / manuel.
    needs: unit
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image (même Chrome/ChromeDriver qu'en prod)
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t docker-api-iol:ci .
      - name: Tests live dans le conteneur
        run: |
          docker run --rm \
            -e RUN_LIVE_TESTS=1 \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/pytest.ini:/app/pytest.ini:ro" \
            docker-api-iol:ci \
            sh -c "pip install -q -r tests/requirements-dev.txt && pytest -m live -v --timeout 600 -p no:cacheprovider"

  deploy:
    name: Déploiement VPS Hostinger
    # Uniquement un push sur master (ou lancement manuel) dont les tests unitaires ET live sont verts.
    needs: [unit, live]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clé SSH de déploiement
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Envoi du code au VPS (bundle git, sans dépendre de GitHub côté serveur)
        run: |
          git bundle create deploy.bundle HEAD
          scp -q -i ~/.ssh/deploy_key deploy.bundle "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/deploy.bundle"

      - name: Mise à jour, rebuild, health check (rollback automatique si échec)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /root/iol-api
          PREV=$(git rev-parse HEAD)
          git fetch -q /root/deploy.bundle HEAD
          git reset -q --hard FETCH_HEAD
          rm -f /root/deploy.bundle
          bash deploy/update-vps.sh "$PREV"
          EOF

      - name: Vérification par l'URL publique
        run: |
          expected="${GITHUB_SHA::7}"
          for i in $(seq 1 12); do
            got=$(curl -fsS -m 15 "${{ vars.API_HEALTH_URL }}" | sed -E 's/.*"version": *"([^"]+)".*/\1/' || true)
            if [ "$got" = "$expected" ]; then echo "OK : version $got en ligne"; exit 0; fi
            sleep 5
          done
          echo "Version en ligne '$got' différente de '$expected'"; exit 1

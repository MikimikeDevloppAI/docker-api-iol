name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Health-check hebdomadaire du site ESCRS (lundi 06:00 UTC) : détecte un changement
    # de markup (switch renommé, champ déplacé...) avant qu'un utilisateur ne le subisse.
    - cron: "0 6 * * 1"

jobs:
  unit:
    name: Tests unitaires (sans navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt -r tests/requirements-dev.txt
      - run: pytest -m "not live" -v

  live:
    name: Tests live ESCRS (image Docker de prod)
    runs-on: ubuntu-latest
    # Sur push : uniquement après les tests unitaires. Toujours sur schedule / manuel.
    needs: unit
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image (même Chrome/ChromeDriver qu'en prod)
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t docker-api-iol:ci .
      - name: Tests live dans le conteneur
        run: |
          docker run --rm \
            -e RUN_LIVE_TESTS=1 \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/pytest.ini:/app/pytest.ini:ro" \
            docker-api-iol:ci \
            sh -c "pip install -q -r tests/requirements-dev.txt && pytest -m live -v --timeout 600 -p no:cacheprovider"
